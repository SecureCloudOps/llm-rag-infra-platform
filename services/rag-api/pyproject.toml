[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-api"
version = "0.2.0"
description = "Tenant-isolated FastAPI RAG API with OIDC and semantic retrieval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.10.0,<3",
    "qdrant-client~=1.12.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.7.0,<1",
]
dev = [
    "pytest>=8.0.0",
]
semantic-test = [
    "pytest>=8.0.0",
    "fastembed>=0.7.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["semantic: downloads a real embedding model for retrieval quality smoke testing"]
