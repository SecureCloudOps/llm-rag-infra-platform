services:
  rag-api:
    build:
      context: ./services/rag-api
    image: llm-rag-infra-platform/rag-api:local
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set a nonempty shared QDRANT_API_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER to your trusted issuer}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE to the API audience}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Set OIDC_JWKS_URL to your trusted HTTPS JWKS endpoint}
      COLLECTION_NAME: ${COLLECTION_NAME:-documents-minilm-v2-acl}
      EMBEDDING_PROVIDER: sentence_transformers
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_MODEL_REVISION: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
      EMBEDDING_DIMENSIONS: "384"
      EMBEDDING_DEVICE: cpu
      EMBEDDING_CACHE_DIR: /models
      HF_HOME: /models/hf
      NO_PROXY: qdrant,localhost,127.0.0.1
      no_proxy: qdrant,localhost,127.0.0.1
      OMP_NUM_THREADS: "2"
      LLM_PROVIDER: mock
      VLLM_BASE_URL: http://vllm:8001
      MODEL_NAME: mistral-7b-instruct
    volumes:
      - embedding-cache:/models
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set a nonempty shared QDRANT_API_KEY}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-storage:
  embedding-cache:
