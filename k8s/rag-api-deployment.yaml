apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: ai-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: llm-rag-infra-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/part-of: llm-rag-infra-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-api
          image: ghcr.io/securecloudops/llm-rag-infra-platform/rag-api:10334517d6e2c94b370d4d630f33939e829c8d5b # gitleaks:allow -- public immutable Git commit SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rag-api-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: embedding-cache
              mountPath: /models
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: embedding-cache
          persistentVolumeClaim:
            claimName: embedding-cache
        - name: tmp
          emptyDir: {}
