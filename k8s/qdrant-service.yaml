apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ai-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: llm-rag-infra-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: grpc
      protocol: TCP
