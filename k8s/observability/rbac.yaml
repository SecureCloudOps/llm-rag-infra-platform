apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-rag-prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: llm-rag-infra-platform
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
      - nodes
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-rag-prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: llm-rag-infra-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llm-rag-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
