apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: llm-rag-infra-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
