name: RAG API CI

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Test and build RAG API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/rag-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/rag-api/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: python -m pytest

      - name: Run linting if configured
        run: |
          if python - <<'PY'
          import pathlib
          import sys

          text = pathlib.Path("pyproject.toml").read_text()
          configured = any(
              marker in text
              for marker in ("[tool.ruff", "[tool.flake8", "[tool.black", "[tool.mypy")
          )
          sys.exit(0 if configured else 1)
          PY
          then
            if grep -q '^\[tool.ruff' pyproject.toml; then
              python -m ruff check .
            fi
            if grep -q '^\[tool.black' pyproject.toml; then
              python -m pip install black
              python -m black --check .
            fi
            if grep -q '^\[tool.mypy' pyproject.toml; then
              python -m pip install mypy
              python -m mypy .
            fi
            if grep -q '^\[tool.flake8' pyproject.toml; then
              python -m pip install flake8
              python -m flake8 .
            fi
          else
            echo "No configured Python linting tools found; skipping lint step."
          fi

      - name: Build Docker image
        run: docker build --tag rag-api:ci .

      - name: Log in to GitHub Container Registry
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          IMAGE_NAME: ghcr.io/securecloudops/llm-rag-infra-platform/rag-api
        run: |
          docker tag rag-api:ci "$IMAGE_NAME:${GITHUB_SHA}"
          docker tag rag-api:ci "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

  semantic-integration:
    name: Real CPU semantic retrieval against Qdrant
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.6
        ports:
          - 6333:6333
    env:
      EMBEDDING_PROVIDER: sentence_transformers
      EMBEDDING_DIMENSIONS: "384"
      EMBEDDING_CACHE_DIR: /tmp/rag-models
      HF_HOME: /tmp/huggingface
      OMP_NUM_THREADS: "2"
      QDRANT_URL: http://localhost:6333
      RUN_SEMANTIC_INTEGRATION: "1"
      RUN_QDRANT_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/rag-api/requirements.lock
      - uses: actions/cache@v4
        with:
          path: /tmp/rag-models
          key: minilm-c9745ed1d9f207416be6d2e6f8de32d1f16199bf
      - name: Install CPU dependencies
        run: |
          pip install -r services/rag-api/requirements.lock
          pip install --no-deps --no-build-isolation -e services/rag-api
      - name: Real ingestion, ask, restart, cache and isolation
        run: python -m pytest services/rag-api/tests -m integration -v
      - name: Measure semantic and mock retrieval
        run: python benchmarks/semantic-retrieval/run.py --output benchmarks/semantic-retrieval/ci-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-retrieval-results
          path: benchmarks/semantic-retrieval/ci-results.json
