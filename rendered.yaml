apiVersion: v1
kind: Namespace
metadata:
  name: ai-system
---
apiVersion: v1
data:
  COLLECTION_NAME: documents
  LLM_PROVIDER: vllm
  MODEL_NAME: placeholder-local-model
  QDRANT_URL: http://qdrant:6333
  VLLM_BASE_URL: http://vllm.ai-system.svc.cluster.local:8000/v1
kind: ConfigMap
metadata:
  name: rag-api-config
  namespace: ai-system
---
apiVersion: v1
data:
  MODEL_NAME: placeholder-local-model
  VLLM_HOST: 0.0.0.0
  VLLM_LOG_LEVEL: info
  VLLM_PORT: "8000"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: llm-rag-infra-platform
  name: vllm-config
  namespace: ai-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: llm-rag-infra-platform
  name: qdrant
  namespace: ai-system
spec:
  clusterIP: None
  ports:
  - name: http
    port: 6333
    protocol: TCP
    targetPort: http
  - name: grpc
    port: 6334
    protocol: TCP
    targetPort: grpc
  selector:
    app.kubernetes.io/name: qdrant
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: llm-rag-infra-platform
  name: rag-api
  namespace: ai-system
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: rag-api
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: llm-rag-infra-platform
  name: vllm
  namespace: ai-system
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: vllm
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: llm-rag-infra-platform
  name: qdrant-storage
  namespace: ai-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: llm-rag-infra-platform
  name: rag-api
  namespace: ai-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/part-of: llm-rag-infra-platform
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: rag-api-config
        image: ghcr.io/example/llm-rag-infra-platform/rag-api:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
        name: rag-api
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: llm-rag-infra-platform
  name: vllm
  namespace: ai-system
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/part-of: llm-rag-infra-platform
    spec:
      containers:
      - args:
        - --host
        - $(VLLM_HOST)
        - --port
        - $(VLLM_PORT)
        - --model
        - $(MODEL_NAME)
        - --served-model-name
        - $(MODEL_NAME)
        command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
        envFrom:
        - configMapRef:
            name: vllm-config
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
        name: vllm
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: llm-rag-infra-platform
  name: qdrant
  namespace: ai-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  serviceName: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: llm-rag-infra-platform
    spec:
      containers:
      - image: qdrant/qdrant:v1.12.6
        imagePullPolicy: IfNotPresent
        name: qdrant
        ports:
        - containerPort: 6333
          name: http
          protocol: TCP
        - containerPort: 6334
          name: grpc
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /qdrant/storage
          name: qdrant-storage
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: qdrant-storage
        persistentVolumeClaim:
          claimName: qdrant-storage
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rag-api-ingress
  namespace: ai-system
spec:
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 8000
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rag-api-to-qdrant
  namespace: ai-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: rag-api
    ports:
    - port: 6333
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rag-api-to-vllm
  namespace: ai-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: rag-api
    ports:
    - port: 8000
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vllm
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ai-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
